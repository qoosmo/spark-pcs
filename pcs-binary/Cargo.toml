[package]
name = "spark-binary"
version = "0.10.0"
edition = "2021"

[features]
default = ["tplus1"]
tplus1 = []
legacy-gates = []
brief18t_instrument = []
rc1-layout = []

[dependencies]
blake3 = "1"
rand = "0.8"
rayon = "1.12"
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "field"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "fold"
harness = false

[[bench]]
name = "blake3_one_hash"
harness = false

[[bin]]
name = "v010_release_smoke"
path = "src/bin/v010_release_smoke.rs"
required-features = ["tplus1"]

[[bin]]
name = "brief18v_v010_smoke"
path = "src/bin/brief18v_v010_smoke.rs"
required-features = ["tplus1"]
